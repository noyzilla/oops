services:
  oops-engine:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops-engine
    restart: unless-stopped
    command: ["server", "--port", "8080"]
    environment:
      PORT: "8080"
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-600}
    labels:
      # Optional: Ingress through Caddy for Webhook
      caddy: "webhook.${DOMAIN:-example.com}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/work
      - backup_data:/work/backups
    working_dir: /work
    ports:
      - "8080:8080"
    networks:
      - net-edge
      - net-db

volumes:
  backup_data:

networks:
  net-edge:
    name: net-edge
    external: true
  net-db:
    name: net-db
    external: true
