services:
  oops-engine:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops-engine
    restart: unless-stopped
    command: ["server", "--port", "8080"]
    environment:
      OOPS_PORT: ${OOPS_PORT:-8080}
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_STOP_TIMEOUT: ${OOPS_STOP_TIMEOUT:-30s}
      OOPS_HEALTHCHECK_TIMEOUT: ${OOPS_HEALTHCHECK_TIMEOUT:-10m}
      OOPS_HEALTHCHECK_INTERVAL: ${OOPS_HEALTHCHECK_INTERVAL:-3s}
      OOPS_BACKUP_RETENTION: ${OOPS_BACKUP_RETENTION:-7d}
      OOPS_BACKUP_DIR: ${OOPS_BACKUP_DIR:-/work/backups}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    labels:
      # Optional: Ingress through Caddy for Webhook
      caddy: "webhook.${DOMAIN:-example.com}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/work
      - backup_data:/work/backups
    working_dir: /work
    ports:
      - "8080:8080"
    networks:
      - net-edge
      - net-db

volumes:
  backup_data:

networks:
  net-edge:
    name: net-edge
    external: true
  net-db:
    name: net-db
    external: true
