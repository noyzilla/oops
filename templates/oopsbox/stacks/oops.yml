# ==============================================================================
# Oops Unified Stack Configuration (oops.yml)
# ==============================================================================
# Master configuration for registry shortcuts and stack service profiles.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Registry Aliases (Short prefixes for long image repositories)
# Usage:
#   oops pull gar/my-app:v1.0
#   oops update gar/my-app:v1.0 -d 2s
#   oops restart gar/my-app:v1.0
# ------------------------------------------------------------------------------
registries:
  gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
  ghcr: ghcr.io/noyzilla
  # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com

# ------------------------------------------------------------------------------
# 2. Service Groups / Stack Profiles
# Usage:
#   oops up @core
#   oops stop @pg
#   devoops start [group]
# ------------------------------------------------------------------------------
groups:
  # Core Stack: Caddy Edge Router + MySQL + Redis + Oops Daemon
  core:
    - /edge
    - mysql
    - redis
    - /utils

  # Postgres Stack: Caddy Edge Router + Postgres + Redis + Oops Daemon
  pg:
    - /edge
    - postgres
    - redis
    - /utils

  # Minimal / Edge Only: Only Caddy Ingress Router
  minimal:
    - /edge

  # Full Stack: All services across edge, db, utils, and apps
  all:
    - /edge
    - /db
    - /utils
    - /apps

# ------------------------------------------------------------------------------
# 3. Automated Backup Configuration (Database Dumps + Filesystem Data Volumes)
# Usage:
#   oops backup             # Full backup (DB + Data)
#   oops backup-db          # Backup databases only
#   oops backup-data        # Backup filesystem volumes only
#   oops backup prune       # Clean all expired backup archives
# ------------------------------------------------------------------------------
backups:
  retention: 7d             # Default retention for all backups (7 days)
  data:
    - name: uploads         # Creates: backups/data_uploads_<TIMESTAMP>.tar.gz
      paths:
        - data/apps/uploads
        - data/wordpress/wp-content/uploads

    - name: certs           # Creates: backups/data_certs_<TIMESTAMP>.tar.gz
      paths:
        - data/caddy

    - name: storage         # Creates: backups/data_storage_<TIMESTAMP>.tar.gz
      paths:
        - data/storage

    - name: redis           # Creates: backups/data_redis_<TIMESTAMP>.tar.gz
      paths:
        - data/redis

# ------------------------------------------------------------------------------
# 4. Workstation VM Configuration (Colima Dev Environment)
# Usage:
#   devoops start           # Starts Colima with specified CPU, memory, and vm_type
# ------------------------------------------------------------------------------
colima:
  cpu: 4                    # Number of CPU cores allocated to VM
  memory: 4                 # Memory in GB allocated to VM
  disk: 60                  # Disk size in GB allocated to VM
  vm_type: vz               # VM hypervisor engine: vz (recommended) or qemu

