services:
  oops:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops
    hostname: oops.oops
    restart: unless-stopped
    entrypoint: ["oops"]
    command: ["server"]
    environment:
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_DNS_UPSTREAM: ${OOPS_DNS_UPSTREAM:-1.1.1.1:53,8.8.8.8:53}
      OOPS_STOP_TIMEOUT: ${OOPS_STOP_TIMEOUT:-30s}
      OOPS_HEALTHCHECK_TIMEOUT: ${OOPS_HEALTHCHECK_TIMEOUT:-10m}
      OOPS_HEALTHCHECK_INTERVAL: ${OOPS_HEALTHCHECK_INTERVAL:-3s}
      OOPS_BACKUP_RETENTION: ${OOPS_BACKUP_RETENTION:-7d}
      OOPS_BACKUP_DIR: ${OOPS_BACKUP_DIR:-/work/backups}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    labels:
      # Ingress through Caddy
      caddy: "${OOPS_DOMAIN:-oops.web.oops}"
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/work
    working_dir: /work
    networks:
      - net-edge
      - net-db

networks:
  net-edge:
    name: net-edge
    external: true
  net-db:
    name: net-db
    external: true
