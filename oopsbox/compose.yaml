x-oops-groups:
  edge:
    - /services/caddy/caddy-proxy
  db:
    - /services/mysql/mysql
    - /services/postgres/postgres
    - /services/redis/redis
  tools:
    - /services/httpbin/httpbin
    - /services/mailpit/mailpit

services:
  oops:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops
    hostname: oops.oops
    restart: unless-stopped
    entrypoint: [ "oops" ]
    command: [ "server" ]
    environment:
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_STOP_TIMEOUT: ${OOPS_STOP_TIMEOUT:-30s}
      OOPS_HEALTHCHECK_TIMEOUT: ${OOPS_HEALTHCHECK_TIMEOUT:-10m}
      OOPS_HEALTHCHECK_INTERVAL: ${OOPS_HEALTHCHECK_INTERVAL:-3s}
      OOPS_BACKUP_RETENTION: ${OOPS_BACKUP_RETENTION:-7d}
      OOPS_BACKUP_DIR: ${OOPS_BACKUP_DIR:-/oopsbox/backups}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    labels:
      caddy: "${OOPS_DOMAIN:-oops.web.oops}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/oopsbox
    working_dir: /oopsbox
    networks:
      - oops_edge
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

networks:
  default:
    name: oops_default
  oops_edge:
    name: oops_edge
    driver: bridge
  oops_db:
    name: oops_db
    driver: bridge
  oops_storage:
    name: oops_storage
    driver: bridge
