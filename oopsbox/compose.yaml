# ==============================================================================
# Oops Base Manifest (compose.yaml)
# ==============================================================================
# Defines stack/service auto-start order (x-oops-stack) and default network.
# Services or stacks omitted from x-oops-stack will not auto-start on 'oops up'.
# ==============================================================================
# name: oops

x-oops-stack:
  - /edge
  - /db
  - /tools
  # - /storage

networks:
  default:
    name: oops_default
    ipam:
      config:
        - subnet: 10.240.0.0/16
