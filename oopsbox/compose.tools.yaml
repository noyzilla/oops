x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-oops-stack:
  - httpbin
  - mailpit

services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    container_name: httpbin
    hostname: httpbin.oops
    restart: unless-stopped
    logging: *default-logging
    labels:
      oops.enable: "true"
      caddy: "httpbin.web.oops"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    networks:
      - oops_edge

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    hostname: mailpit.oops
    restart: unless-stopped
    logging: *default-logging
    labels:
      oops.enable: "true"
      caddy: "mailpit.web.oops"
      caddy.reverse_proxy: "{{upstreams 8025}}"
    networks:
      - oops_edge
