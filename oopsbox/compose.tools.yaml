# ==============================================================================
# Oops Tools Stack Manifest (compose.tools.yaml)
# ==============================================================================
# Developer utility tools (HTTP debugging, mock SMTP) routed through oops_default.
# ==============================================================================
x-oops-stack:
  - httpbin
  - mailpit

services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    container_name: httpbin
    hostname: httpbin.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    labels:
      oops.enable: "true"
      caddy: "httpbin.web.oops"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    networks:
      - default

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    hostname: mailpit.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    labels:
      oops.enable: "true"
      caddy: "mailpit.web.oops"
      caddy.reverse_proxy: "{{upstreams 8025}}"
    networks:
      - default

networks:
  default:
    name: oops_default
