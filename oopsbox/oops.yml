# ==============================================================================
# Oops Unified Stack Configuration (oops.yml)
# ==============================================================================
# Master configuration for registry shortcuts and stack service profiles.
# ==============================================================================

# ------------------------------------------------------------------------------
# Registry Aliases (Short prefixes for long image repositories)
# Usage:
#   oops pull gar/my-app:v1.0
#   oops update gar/my-app:v1.0 -d 2s
#   oops restart gar/my-app:v1.0
# ------------------------------------------------------------------------------
registries:
  noyzilla: ghcr.io/noyzilla
  # gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
  # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com

# ------------------------------------------------------------------------------
# Workstation & Project Profiles
# Usage:
#   oops up                 # Starts default profile (@default)
#   oops up @lab            # Starts custom project profile
#   oops up @all            # Starts all stacks dynamically (built-in engine selector)
#   oops switch @lab        # Switches active profile and stops other services
#   oopsbox start           # Starts default profile on workstation
# ------------------------------------------------------------------------------
profiles:
  # Default Development Profile (Caddy Edge Router + Oops DNS Daemon)
  default:
    - /edge

  # Example Custom Project Profile (uncomment and customize as needed):
  # lab:
  #   - /edge
  #   - mysql
  #   - redis
  #   - web-app

# ------------------------------------------------------------------------------
# Automated Backup Configuration (Database Dumps + Filesystem Data Volumes)
# Usage:
#   oops backup             # Full backup (DB + Data)
#   oops backup-db          # Backup databases only
#   oops backup-data        # Backup filesystem volumes only
#   oops backup prune       # Clean all expired backup archives
# ------------------------------------------------------------------------------
backups:
  retention: 7d             # Default retention for all backups (7 days)
  data:
    #- name: uploads         # Creates: backups/data_uploads_<TIMESTAMP>.tar.gz
    #  paths:
    #    - data/apps/uploads
    #    - data/wordpress/wp-content/uploads

    #- name: storage         # Creates: backups/data_storage_<TIMESTAMP>.tar.gz
    #  paths:
    #    - data/storage

# ------------------------------------------------------------------------------
# Shared DNS Engine Configuration (Team / Infra DNS)
# Usage:
#   oops dns                # Inspect active DNS resolution table
#   oops dns get <domain>   # Query resolved IP for domain
# ------------------------------------------------------------------------------
dns:
  tld: oops                 # Top-level domain for local resolution (e.g. oops, anthole, anthill)
  upstreams:
    - 1.1.1.1:53
    - 8.8.8.8:53
  records:
    # - api.internal 10.0.0.5
    # - .staging.oops 10.0.0.10

# ------------------------------------------------------------------------------
# Storage Guard (blocks services whose bind-mount paths are unhealthy)
# A path is unhealthy when it passes through a dead symlink, or resolves under a mount
# prefix while still on the OS disk (persistent disk not mounted). Backups use
# OOPS_BACKUP_DIR and are checked only by backup commands. Tools: oops storage check|link.
#   mount_prefixes: replaces the default [/mnt, /media, /Volumes]; [] keeps only dead-link checks
#   priority:       earlier = higher; unlisted = lowest; entries are /stack, service or @group.
#                   Services using a bad link and every lower-priority service are blocked.
#                   The edge stack is never blocked and always starts first.
# ------------------------------------------------------------------------------
#storage:
#  mount_prefixes: [/mnt, /media, /Volumes]
#priority:
#  - /edge
#  - /db
#  - /apps
