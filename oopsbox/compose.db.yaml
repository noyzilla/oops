x-oops-stack:
  - mysql
  - postgres
  - redis

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    hostname: mysql.oops
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OOPS_DB_MYSQL_PASSWORD:?OOPS_DB_MYSQL_PASSWORD must be set}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - oops_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres.oops
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${OOPS_DB_POSTGRES_PASSWORD:?OOPS_DB_POSTGRES_PASSWORD must be set}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - oops_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis.oops
    restart: unless-stopped
    command: [ "sh", "-c", "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${REDIS_PASSWORD}\"; else exec redis-server; fi" ]
    environment:
      REDIS_PASSWORD: ${OOPS_DB_REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    networks:
      - oops_db
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  oops_db:
    name: oops_db
    driver: bridge

