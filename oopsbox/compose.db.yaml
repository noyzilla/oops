# ==============================================================================
# Oops Database Stack Manifest (compose.db.yaml)
# ==============================================================================
# Persistent databases and caches connected to the trusted core oops_default network.
# ==============================================================================
x-oops-stack:
  - mysql
  - postgres
  - redis

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    hostname: mysql.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${OOPS_DB_MYSQL_PASSWORD:?OOPS_DB_MYSQL_PASSWORD must be set}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    environment:
      POSTGRES_PASSWORD: ${OOPS_DB_POSTGRES_PASSWORD:?OOPS_DB_POSTGRES_PASSWORD must be set}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    environment:
      REDIS_PASSWORD: ${OOPS_DB_REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    init: true
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ ! -f /data/users.acl ]; then
          if [ -n "$$REDIS_PASSWORD" ]; then
            echo "user default on >$$REDIS_PASSWORD ~* &* +@all" > /data/users.acl
          else
            echo "user default on nopass ~* &* +@all" > /data/users.acl
          fi
          chmod 644 /data/users.acl
        fi
        exec "$$@"
      - --
    command:
      - redis-server
      - --aclfile
      - /data/users.acl
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --maxclients
      - "1000"
      - --tcp-keepalive
      - "60"
      - --timeout
      - "1800"
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi" ]
      interval: 10s
      timeout: 5s
      retries: 5
