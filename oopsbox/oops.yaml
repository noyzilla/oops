# ==============================================================================
# Oops System-Level Orchestrator Settings (oops.yaml)
# ==============================================================================
# Pure configuration file for the Oops CLI and Orchestrator daemon.
# ==============================================================================
x-oops:
  secret: ${OOPS_SECRET:-}

  db:
    mysql_password: ${OOPS_DB_MYSQL_PASSWORD:-}
    postgres_password: ${OOPS_DB_POSTGRES_PASSWORD:-}
    redis_password: ${OOPS_DB_REDIS_PASSWORD:-}

  orchestrator:
    stop_timeout: 30s
    healthcheck:
      timeout: 10m
      interval: 3s

  backup:
    dir: ./backups
    retention: 7d
    data:
      #- name: uploads
      #  paths:
      #    - data/apps/uploads
      #- name: storage
      #  paths:
      #    - data/storage

  network:
    # Authoritative L3 subnet envelope for this host / remote capsule.
    # Default: 10.240.0.0/24 (Single network: matches compose.yaml oops_default).
    # Multi-network expansion: Use /16 (e.g. 10.240.0.0/16) if hosting multiple
    # isolated subnets on this single host.
    # Multi-host mesh: Assign distinct /24 subnets across remote hosts
    # (e.g. @server1: 10.240.0.0/24, @server2: 10.240.1.0/24) to prevent routing collisions.
    subnet: 10.240.0.0/24

  dns:
    tld: oops
    upstreams:
      - 1.1.1.1:53
      - 8.8.8.8:53
    records:
      # - api.internal 10.0.0.5
      # - .staging.oops 10.0.0.10

  volume:
    mount_prefixes: [/mnt, /media, /Volumes]

  registries:
    # my_org: ghcr.io/my_org
    # gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
    # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com
