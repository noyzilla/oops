# ==============================================================================
# Oops Orchestrator Compose Manifest & System Settings (oops.yaml)
# ==============================================================================
# Runs the Oops webhook daemon and declares system-level orchestrator settings.
# ==============================================================================
services:
  oops:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops
    hostname: oops.oops
    restart: unless-stopped
    entrypoint: [ "oops" ]
    command: [ "server" ]
    environment:
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_STOP_TIMEOUT: ${OOPS_STOP_TIMEOUT:-30s}
      OOPS_HEALTHCHECK_TIMEOUT: ${OOPS_HEALTHCHECK_TIMEOUT:-10m}
      OOPS_HEALTHCHECK_INTERVAL: ${OOPS_HEALTHCHECK_INTERVAL:-3s}
      OOPS_BACKUP_RETENTION: ${OOPS_BACKUP_RETENTION:-7d}
      OOPS_BACKUP_DIR: ${OOPS_BACKUP_DIR:-/oopsbox/backups}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    labels:
      caddy: "${OOPS_DOMAIN:-oops.web.oops}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/oopsbox
    working_dir: /oopsbox
    networks:
      - oops_edge
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

networks:
  oops_edge:
    external: true

# ------------------------------------------------------------------------------
# System-Level Orchestrator Settings (Registry Aliases, Backups, DNS, Volume)
# ------------------------------------------------------------------------------
x-oops:
  registries:
    #my_org: ghcr.io/my_org
    # gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
    # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com

  backups:
    retention: 7d
    data:
      #- name: uploads
      #  paths:
      #    - data/apps/uploads
      #- name: storage
      #  paths:
      #    - data/storage

  dns:
    tld: oops
    upstreams:
      - 1.1.1.1:53
      - 8.8.8.8:53
    records:
      # - api.internal 10.0.0.5
      # - .staging.oops 10.0.0.10

  volume:
    mount_prefixes: [/mnt, /media, /Volumes]
