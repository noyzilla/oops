# ==============================================================================
# Oops Orchestrator Compose Manifest & System Settings (oops.yaml)
# ==============================================================================
# Runs the Oops webhook daemon and declares system-level orchestrator settings.
# ==============================================================================
services:
  oops:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops
    hostname: oops.oops
    restart: unless-stopped
    entrypoint: [ "oops" ]
    command: [ "server" ]
    environment:
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_DB_MYSQL_PASSWORD: ${OOPS_DB_MYSQL_PASSWORD:-}
      OOPS_DB_POSTGRES_PASSWORD: ${OOPS_DB_POSTGRES_PASSWORD:-}
      OOPS_DB_REDIS_PASSWORD: ${OOPS_DB_REDIS_PASSWORD:-}
    labels:
      caddy: "${OOPS_DOMAIN:-oops.web.oops}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/oopsbox
    working_dir: /oopsbox
    networks:
      - oops_edge
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

networks:
  oops_edge:
    external: true

# ------------------------------------------------------------------------------
# System-Level Orchestrator Settings (x-oops)
# ------------------------------------------------------------------------------
x-oops:
  secret: ${OOPS_SECRET:-}

  db:
    mysql_password: ${OOPS_DB_MYSQL_PASSWORD:-}
    postgres_password: ${OOPS_DB_POSTGRES_PASSWORD:-}
    redis_password: ${OOPS_DB_REDIS_PASSWORD:-}

  orchestrator:
    stop_timeout: 30s
    healthcheck:
      timeout: 10m
      interval: 3s

  backup:
    dir: ./backups
    retention: 7d
    data:
      #- name: uploads
      #  paths:
      #    - data/apps/uploads
      #- name: storage
      #  paths:
      #    - data/storage

  dns:
    tld: oops
    upstreams:
      - 1.1.1.1:53
      - 8.8.8.8:53
    records:
      # - api.internal 10.0.0.5
      # - .staging.oops 10.0.0.10

  volume:
    mount_prefixes: [/mnt, /media, /Volumes]

  registries:
    # my_org: ghcr.io/my_org
    # gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
    # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com
