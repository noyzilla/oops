# ==============================================================================
# Oops Unified Stack Configuration (oops.yaml)
# ==============================================================================
# Master configuration for registry aliases, backups, DNS, and volume guard.
# ==============================================================================

# ------------------------------------------------------------------------------
# Registry Aliases (Short prefixes for long image repositories)
# Usage:
#   oops pull noyzilla/my-app:v1.0
#   oops update noyzilla/my-app:v1.0 -d 2s
#   oops restart noyzilla/my-app:v1.0
# ------------------------------------------------------------------------------
registries:
  noyzilla: ghcr.io/noyzilla
  # gar: asia-southeast1-docker.pkg.dev/my-project/my-repo
  # ecr: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com

# ------------------------------------------------------------------------------
# Automated Backup Configuration (Database Dumps + Filesystem Data Volumes)
# Usage:
#   oops backup             # Full backup (DB + Data)
#   oops backup-db          # Backup databases only
#   oops backup-data        # Backup filesystem volumes only
#   oops backup prune       # Clean all expired backup archives
# ------------------------------------------------------------------------------
backups:
  retention: 7d             # Default retention for all backups (7 days)
  data:
    #- name: uploads         # Creates: backups/data_uploads_<TIMESTAMP>.tar.gz
    #  paths:
    #    - data/apps/uploads
    #    - data/wordpress/wp-content/uploads

    #- name: storage         # Creates: backups/data_storage_<TIMESTAMP>.tar.gz
    #  paths:
    #    - data/storage

# ------------------------------------------------------------------------------
# Shared DNS Engine Configuration (Team / Infra DNS)
# Usage:
#   oops dns                # Inspect active DNS resolution table
#   oops dns get <domain>   # Query resolved IP for domain
# ------------------------------------------------------------------------------
dns:
  tld: oops                 # Top-level domain for local resolution (e.g. oops, anthole, anthill)
  upstreams:
    - 1.1.1.1:53
    - 8.8.8.8:53
  records:
    # - api.internal 10.0.0.5
    # - .staging.oops 10.0.0.10

# ------------------------------------------------------------------------------
# Volume Guard (blocks services whose bind-mount paths are unhealthy)
# ------------------------------------------------------------------------------
#volume:
