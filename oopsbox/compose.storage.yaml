x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-oops-stack:
  - seaweedfs

services:
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    hostname: seaweedfs.oops
    restart: unless-stopped
    logging: *default-logging
    command: "server -s3 -dir=/data"
    volumes:
      - ./data/storage:/data
    networks:
      - oops_storage

networks:
  oops_storage:
    name: oops_storage
    driver: bridge
