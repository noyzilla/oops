# ==============================================================================
# Oops Storage Stack Manifest (compose.storage.yaml)
# ==============================================================================
# S3-compatible distributed object storage on the oops_storage bridge network.
# ==============================================================================
x-oops-stack:
  - seaweedfs

services:
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    hostname: seaweedfs.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    command: "server -s3 -dir=/data"
    volumes:
      - ./data/storage:/data
    networks:
      - oops_storage

networks:
  oops_storage:
    name: oops_storage
    driver: bridge
