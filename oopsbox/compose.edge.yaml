# ==============================================================================
# Oops Edge Stack Manifest (compose.edge.yaml)
# ==============================================================================
# Ingress and management gateway routing through Caddy Docker Proxy.
# ==============================================================================
x-oops-stack:
  - oops
  - caddy-proxy

services:
  oops:
    image: ghcr.io/noyzilla/oops:latest
    container_name: oops
    hostname: oops.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    entrypoint: [ "oops" ]
    command: [ "server" ]
    environment:
      OOPS_SECRET: ${OOPS_SECRET:?OOPS_SECRET must be set}
      OOPS_DB_MYSQL_PASSWORD: ${OOPS_DB_MYSQL_PASSWORD:-}
      OOPS_DB_POSTGRES_PASSWORD: ${OOPS_DB_POSTGRES_PASSWORD:-}
      OOPS_DB_REDIS_PASSWORD: ${OOPS_DB_REDIS_PASSWORD:-}
    labels:
      caddy: "${OOPS_DOMAIN:-oops.web.oops}"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/oopsbox
    working_dir: /oopsbox
    networks:
      default:
        ipv4_address: 10.240.0.2
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3

  caddy-proxy:
    image: lucaslorentz/caddy-docker-proxy:alpine
    container_name: caddy-proxy
    hostname: .web.oops
    restart: unless-stopped
    extends:
      file: common.yaml
      service: common-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: oops_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 10.240.0.3

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: oops_default
