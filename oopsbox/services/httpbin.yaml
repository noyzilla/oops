services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    container_name: httpbin
    hostname: httpbin.oops
    restart: unless-stopped
    labels:
      oops.enable: "true"
      caddy: "httpbin.web.oops"
      caddy.reverse_proxy: "{{upstreams 8080}}"
    networks:
      - oops_edge

networks:
  oops_edge:
    external: true
