services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql.oops
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OOPS_DB_MYSQL_PASSWORD:?OOPS_DB_MYSQL_PASSWORD must be set}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - oops_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  oops_db:
    external: true
