services:
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    hostname: seaweedfs.oops
    restart: unless-stopped
    command: "server -s3 -dir=/data"
    volumes:
      - ./data/storage:/data
    networks:
      - oops_storage

networks:
  oops_storage:
    external: true
