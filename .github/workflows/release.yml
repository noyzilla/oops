name: Release Multi-OS Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build multi-OS binaries
        run: |
          mkdir -p dist
          TAG_VER="${{ github.ref_name }}"
          VERSION="${TAG_VER#v}"
          echo "==> Building release version: ${VERSION}"
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            os="${target%%/*}"
            arch="${target##*/}"
            output="dist/oops-${os}-${arch}"
            echo "==> Building ${output}..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X github.com/noyzilla/oops/cmd.Version=${VERSION}" -o "${output}" .
          done

      - name: Package Oopsbox Blueprint
        run: |
          mkdir -p dist
          tar -czf dist/oopsbox.tar.gz -C oopsbox .

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum oops-* oopsbox.tar.gz > checksums.txt

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Uploading release assets to ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" dist/* --clobber || \
          (sleep 5 && gh release upload "${{ github.ref_name }}" dist/* --clobber)
