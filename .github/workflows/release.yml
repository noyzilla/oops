name: Release Multi-OS Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build multi-OS binaries
        run: |
          mkdir -p dist
          TAG_VER="${{ github.ref_name }}"
          VERSION="${TAG_VER#v}"
          echo "==> Building release version: ${VERSION}"
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            os="${target%%/*}"
            arch="${target##*/}"
            output="dist/oops-${os}-${arch}"
            echo "==> Building ${output}..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X github.com/noyzilla/oops/cmd.Version=${VERSION}" -o "${output}" .
          done

      - name: Package Oopsbox Blueprint
        run: |
          mkdir -p dist
          tar -czf dist/oopsbox.tar.gz -C oopsbox .

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum oops-* oopsbox.tar.gz > checksums.txt

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release Mode is host-release: the release object is created from the
          # CHANGELOG section by the release operator, possibly after the tag push.
          # Wait for it instead of creating it here, to avoid duplicates.
          echo "==> Waiting for release ${TAG} to exist on the host..."
          attempts=60
          interval=10
          for i in $(seq 1 "${attempts}"); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "==> Release ${TAG} found. Uploading assets..."
              gh release upload "${TAG}" dist/* --clobber
              exit 0
            fi
            echo "    [${i}/${attempts}] release not found yet, retrying in ${interval}s..."
            sleep "${interval}"
          done
          echo "::error::Release ${TAG} was not created within $((attempts * interval))s. Create it (gh release create ${TAG} --title \"Release ${TAG}\" --notes-file <notes>) and re-run this job."
          exit 1
